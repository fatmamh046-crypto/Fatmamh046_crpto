<!DOCTYPE html>
<html>

            text-align: center;
            padding: 20px;
        }

        .header {
            background-color: white;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: #7a2cff;
        }

        p {
            font-size: 18px;
        }

        .box {

            padding: 20px;

            max-width: 500px;
        }

        img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="header">

    <h2>Hi, I'm Fatma</h2>

</div>

<div class="box">
    <h2>My Photo</h2>
    <img src="fatma.jpg" alt="Fatma Photo">
</div>

<div class="box">
    <h2>About Me</h2>
    <p>I am a mother.</p>
    <p>I am learning English.</p>
</div>

<div class="box">
    <h2>My Skills</h2>
    <p>English Learning</p>
    <p>Web Design</p>
</div>

<div class="box">

</html>
